# Bitcoin Core config for the eCash Meter node — install at /etc/bitcoin/bitcoin.conf
#
# This joins L2L-Signet (the LayerTwo Labs drivechain signet). It is STOCK
# Bitcoin Core: -signetchallenge / -signetblocktime / -signetseednode are all
# upstream options, so the official bitcoincore.org binary works. No BitWindow,
# no bip300301-enforcer, no orchestratord — eCash Meter only calls
# getblockchaininfo, getblockcount, getblockhash and getblock.

chain=signet

# No wallet is ever needed: the site reads blocks and never signs anything.
# Dropping it removes the largest chunk of attack surface on a public host.
disablewallet=1

# Leave rpcbind/rpcallowip UNSET. The default binds RPC to localhost only, which
# is what we want — the indexer runs on this same box.
#
# Generate this line with Core's contrib/rpcauth/rpcauth.py and put the plaintext
# password in /etc/ecashmeter/indexer.env, never here:
#     ./rpcauth.py ecashmeter
# rpcauth=ecashmeter:<salt>$<hmac>
rpcauth=REPLACE_ME

# NOTE: txindex is intentionally OFF. eCash Meter never calls
# getrawtransaction; getblock verbosity 3 sources per-tx fees and prevout values
# from block undo data instead. This saves the index entirely.
#
# Do NOT enable pruning without thought: verbosity-3 prevouts are unavailable for
# pruned blocks, so the prune horizon caps how far back the store can ever be
# rebuilt (see the PARSER_VERSION note in lib/bmm.ts).

[signet]
# The L2L-Signet identity. A different challenge is a different network.
signetchallenge=00148835832e28c816b7acd8fdb19772ab2199603a56
signetblocktime=600
addnode=172.105.148.135:38333
acceptnonstdtxn=1
